<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Gondi-inspired radial sun motif -->
  <g opacity="0.12">
    <!-- Outer ring of triangles -->
    <g fill="#8B1A1A">
      <polygon points="100,10 107,35 93,35"/>
      <polygon points="100,10 107,35 93,35" transform="rotate(30 100 100)"/>
      <polygon points="100,10 107,35 93,35" transform="rotate(60 100 100)"/>
      <polygon points="100,10 107,35 93,35" transform="rotate(90 100 100)"/>
      <polygon points="100,10 107,35 93,35" transform="rotate(120 100 100)"/>
      <polygon points="100,10 107,35 93,35" transform="rotate(150 100 100)"/>
      <polygon points="100,10 107,35 93,35" transform="rotate(180 100 100)"/>
      <polygon points="100,10 107,35 93,35" transform="rotate(210 100 100)"/>
      <polygon points="100,10 107,35 93,35" transform="rotate(240 100 100)"/>
      <polygon points="100,10 107,35 93,35" transform="rotate(270 100 100)"/>
      <polygon points="100,10 107,35 93,35" transform="rotate(300 100 100)"/>
      <polygon points="100,10 107,35 93,35" transform="rotate(330 100 100)"/>
    </g>
    <!-- Middle circle ring -->
    <circle cx="100" cy="100" r="50" stroke="#D4AF37" stroke-width="2" fill="none"/>
    <circle cx="100" cy="100" r="35" stroke="#8B1A1A" stroke-width="1.5" fill="none"/>
    <!-- Inner petals -->
    <g fill="#D4AF37">
      <ellipse cx="100" cy="75" rx="5" ry="12" transform="rotate(0 100 100)"/>
      <ellipse cx="100" cy="75" rx="5" ry="12" transform="rotate(45 100 100)"/>
      <ellipse cx="100" cy="75" rx="5" ry="12" transform="rotate(90 100 100)"/>
      <ellipse cx="100" cy="75" rx="5" ry="12" transform="rotate(135 100 100)"/>
      <ellipse cx="100" cy="75" rx="5" ry="12" transform="rotate(180 100 100)"/>
      <ellipse cx="100" cy="75" rx="5" ry="12" transform="rotate(225 100 100)"/>
      <ellipse cx="100" cy="75" rx="5" ry="12" transform="rotate(270 100 100)"/>
      <ellipse cx="100" cy="75" rx="5" ry="12" transform="rotate(315 100 100)"/>
    </g>
    <!-- Center -->
    <circle cx="100" cy="100" r="12" fill="#8B1A1A"/>
    <circle cx="100" cy="100" r="6"  fill="#D4AF37"/>
  </g>
</svg>
