<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Lotus petals -->
  <g>
    <!-- Center circle -->
    <circle cx="40" cy="40" r="8" fill="#D4AF37"/>
    <!-- 8 petals -->
    <ellipse cx="40" cy="22" rx="6" ry="14" fill="#8B1A1A" opacity="0.85" transform="rotate(0 40 40)"/>
    <ellipse cx="40" cy="22" rx="6" ry="14" fill="#C0392B" opacity="0.7"  transform="rotate(45 40 40)"/>
    <ellipse cx="40" cy="22" rx="6" ry="14" fill="#8B1A1A" opacity="0.85" transform="rotate(90 40 40)"/>
    <ellipse cx="40" cy="22" rx="6" ry="14" fill="#C0392B" opacity="0.7"  transform="rotate(135 40 40)"/>
    <ellipse cx="40" cy="22" rx="6" ry="14" fill="#8B1A1A" opacity="0.85" transform="rotate(180 40 40)"/>
    <ellipse cx="40" cy="22" rx="6" ry="14" fill="#C0392B" opacity="0.7"  transform="rotate(225 40 40)"/>
    <ellipse cx="40" cy="22" rx="6" ry="14" fill="#8B1A1A" opacity="0.85" transform="rotate(270 40 40)"/>
    <ellipse cx="40" cy="22" rx="6" ry="14" fill="#C0392B" opacity="0.7"  transform="rotate(315 40 40)"/>
    <!-- Center dot -->
    <circle cx="40" cy="40" r="4" fill="#F5C842"/>
  </g>
</svg>
