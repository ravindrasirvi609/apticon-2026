<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 24" preserveAspectRatio="repeat">
  <!-- Repeating Bastar tribal border motif -->
  <defs>
    <pattern id="bastar" x="0" y="0" width="40" height="24" patternUnits="userSpaceOnUse">
      <!-- Diamond chain -->
      <polygon points="20,2 30,12 20,22 10,12" fill="none" stroke="#EA580C" stroke-width="1.5"/>
      <!-- Small dots at corners -->
      <circle cx="20" cy="2"  r="1.5" fill="#EA580C"/>
      <circle cx="30" cy="12" r="1.5" fill="#312E81"/>
      <circle cx="20" cy="22" r="1.5" fill="#EA580C"/>
      <circle cx="10" cy="12" r="1.5" fill="#312E81"/>
      <!-- Center dot -->
      <circle cx="20" cy="12" r="2" fill="#EA580C"/>
      <!-- Connecting lines -->
      <line x1="0"  y1="12" x2="10" y2="12" stroke="#EA580C" stroke-width="1"/>
      <line x1="30" y1="12" x2="40" y2="12" stroke="#EA580C" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="24" fill="url(#bastar)"/>
</svg>
