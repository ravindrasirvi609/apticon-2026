<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">
  <rect width="60" height="60" fill="none"/>
  <!-- Bastar-inspired geometric tile -->
  <g opacity="0.18" fill="none" stroke="#8B1A1A" stroke-width="1">
    <!-- Outer diamond -->
    <polygon points="30,4 56,30 30,56 4,30"/>
    <!-- Inner diamond -->
    <polygon points="30,14 46,30 30,46 14,30"/>
    <!-- Center cross -->
    <line x1="30" y1="14" x2="30" y2="46"/>
    <line x1="14" y1="30" x2="46" y2="30"/>
    <!-- Corner dots -->
    <circle cx="30" cy="4"  r="2" fill="#D4AF37" stroke="none"/>
    <circle cx="56" cy="30" r="2" fill="#D4AF37" stroke="none"/>
    <circle cx="30" cy="56" r="2" fill="#D4AF37" stroke="none"/>
    <circle cx="4"  cy="30" r="2" fill="#D4AF37" stroke="none"/>
    <!-- Center -->
    <circle cx="30" cy="30" r="3" fill="#8B1A1A" stroke="none"/>
  </g>
</svg>
